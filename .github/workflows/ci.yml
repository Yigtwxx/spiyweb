name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # The core is pure Python, but the project is meant to run on all three
    # desktop platforms, so the matrix is the point rather than a formality.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync environment
        # `store` is non-negotiable in CI: FAISS itself is the unit under
        # test, there is nothing to fake. `entity` buys the real spaCy import
        # path cheaply (no model download). `embed` (torch) stays out: every
        # line of its glue is covered by fake-encoder tests.
        run: uv sync --group dev --extra store --extra entity --extra view

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  wheel:
    # The zero-dependency rule is a PACKAGING claim, and the `check` job
    # structurally cannot test it: `uv sync --extra store --extra entity`
    # puts numpy and faiss on the path, so `import spiyweb` succeeds there
    # whatever the wheel contains. This job is
    # the only place the claim is measured, and the only place `py.typed`, the
    # single version source and the canonical trace are checked on the
    # ARTIFACT rather than on the checkout.
    #
    # ubuntu only, deliberately: the wheel is `py3-none-any` - byte-identical
    # on all three platforms - and what is under test is dependency isolation,
    # which has no OS dimension. The day a compiled extension ships, this job
    # joins the matrix and not a day before.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build BOTH artifacts, the way a release does
        # `uv build` and not `uv build --wheel`: the two-target build makes
        # the sdist first and then builds the wheel FROM it, which is the
        # path a release takes and the only one that catches a file the
        # sdist forgot.
        run: uv build

      - name: The artifacts are fit to upload
        run: uvx twine check dist/*

      - name: Install it into an empty environment - no extras, no dev group
        run: |
          uv venv .wheelenv
          uv pip install --python .wheelenv/bin/python dist/*.whl

      - name: The environment really is empty
        # Logged as well as asserted: if a dependency ever leaks in, the list
        # is right there next to the failure. An explicit `exit 1` rather
        # than `! cmd`, which errexit does not apply to and which would stop
        # guarding the moment a line is added after it.
        run: |
          uv pip list --python .wheelenv/bin/python
          for mod in numpy faiss torch spacy transformers; do
            if .wheelenv/bin/python -c "import $mod" 2>/dev/null; then
              echo "::error::$mod installed - the wheel is not dependency-free"
              exit 1
            fi
          done

      - name: Smoke the artifact
        run: .wheelenv/bin/python tests/wheel_smoke.py

      - name: The terminal command was registered, and runs with no extras
        # `spiyweb version` exists to tell someone which extra is missing, so
        # an extras-free environment is the one place it MUST work. Every row
        # reading "not installed" here is the correct answer.
        run: |
          .wheelenv/bin/spiyweb version
          .wheelenv/bin/spiyweb --version
